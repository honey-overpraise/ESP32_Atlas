[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.13.0
	adafruit/Adafruit NeoMatrix@^1.3.3
	adafruit/Adafruit NeoPixel@^1.15.5
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	adafruit/Adafruit FT6206 Library@^1.1.1
	fastled/FastLED@^3.10.9
